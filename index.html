  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:400 15.5px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;margin:0}
a{color:var(--eucast)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(28px,7.6vw,40px);font-weight:700;letter-spacing:-.01em}
h2{font-size:19px;font-weight:600}
h3{font-size:16px;font-weight:600}
p{margin:0}
i{font-style:italic}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font:600 11px/1.2 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.ic{width:20px;height:20px;flex:none;display:inline-block;vertical-align:middle}
.ic path,.ic circle,.ic rect,.ic line,.ic polyline{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- barra superior ---------- */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.appbar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:9px 16px;min-height:56px}
.back{all:unset;cursor:pointer;display:none;width:40px;height:40px;border-radius:12px;align-items:center;justify-content:center;margin-left:-8px}
.back:hover{background:var(--surface-2)}
.appbar.inner .back{display:inline-flex}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand b{font:700 19px/1 var(--f-display);white-space:nowrap}
.brand small{display:block;font:500 11.5px/1.2 var(--f-body);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .gdot{width:9px;height:9px;border-radius:50%;background:var(--g);flex:none;display:none}
.appbar.inner .brand .gdot{display:block}
.toptabs{margin-left:auto;display:flex;gap:4px}
.toptabs button{all:unset;cursor:pointer;padding:8px 12px;border-radius:10px;font:600 14px/1 var(--f-body);color:var(--muted)}
.toptabs button[aria-current="page"]{background:var(--surface-2);color:var(--ink)}
@media (max-width:759px){ .toptabs{display:none} }

/* ---------- barra de pestañas ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;min-height:44px;border-radius:12px;font:600 11.5px/1.1 var(--f-body);color:var(--muted);text-align:center}
.tabbar button .ic{width:23px;height:23px}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar button[aria-current="page"] .pill{background:var(--accent-soft);color:var(--accent)}
.tabbar .pill{display:flex;align-items:center;justify-content:center;width:56px;height:30px;border-radius:999px;transition:background .25s}
@media (min-width:760px){ .tabbar{display:none} }

main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){ main{padding-block:28px 64px;padding-inline:24px} }

/* ---------- entrada animada ---------- */
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.enter > *{animation:up .42s cubic-bezier(.2,.8,.2,1) both}
.enter > *:nth-child(2){animation-delay:.04s} .enter > *:nth-child(3){animation-delay:.08s} .enter > *:nth-child(4){animation-delay:.12s} .enter > *:nth-child(5){animation-delay:.16s} .enter > *:nth-child(n+6){animation-delay:.2s}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }

/* ---------- inicio ---------- */
.hero{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.ht{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:14px;align-items:center}
.hero .art{width:92px;height:92px}
.hero .art svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 14px rgba(21,39,43,.18))}
.kicker{font:600 12px/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lede{font-size:16px;color:var(--muted);max-width:62ch;margin-top:8px}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.stat{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font:600 12.5px/1.3 var(--f-body)}
.stat.c{color:var(--clsi);border-color:color-mix(in srgb,var(--clsi) 35%,var(--line))} .stat.e{color:var(--eucast);border-color:color-mix(in srgb,var(--eucast) 35%,var(--line))}
@media (min-width:760px){ .ht{grid-template-columns:minmax(0,1fr) 150px} .hero .art{width:150px;height:150px} }
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:0 12px;box-shadow:var(--shadow);transition:border-color .2s}
.search:focus-within{border-color:var(--ink)}
.search input{all:unset;flex:1;min-width:0;font:500 16px/1.3 var(--f-body);padding:13px 0;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.search .clear{all:unset;cursor:pointer;width:32px;height:32px;display:none;align-items:center;justify-content:center;border-radius:8px;color:var(--muted)}
.search.has .clear{display:inline-flex}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;margin-inline:-16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{all:unset;cursor:pointer;flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:20px;font:600 13.5px/1.2 var(--f-body);color:var(--ink);transition:background .2s,border-color .2s,color .2s}
.fchip .dot{width:9px;height:9px;border-radius:50%;background:currentColor}
.fchip .n{font:600 11.5px/1 var(--f-mono);color:var(--muted)}
.fchip[data-g="gn"] .dot{color:var(--gn)} .fchip[data-g="gp"] .dot{color:var(--gp)} .fchip[data-g="fa"] .dot{color:var(--fa)} .fchip[data-g="all"] .dot{color:var(--ink)}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.fchip[aria-pressed="true"] .n{color:color-mix(in srgb,var(--surface) 70%,transparent)}
.grp{margin-top:22px}
.grp-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.grp-h .bar{width:4px;height:20px;border-radius:2px;background:var(--g)}
.grp-h h2{font-size:18px}
.grp-h .sub{font-size:12.5px;color:var(--muted);margin-left:auto}
.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:640px){ .cards{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (min-width:1000px){ .cards{grid-template-columns:repeat(3,minmax(0,1fr))} }
.mc{all:unset;cursor:pointer;box-sizing:border-box;display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 12px 12px 10px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .18s,border-color .2s}
.mc::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--g)}
.mc:hover{border-color:color-mix(in srgb,var(--g) 50%,var(--line))}
.mc:active{transform:scale(.985)}
.mc .mini{width:62px;height:62px}
.mc .mini svg{width:100%;height:100%;display:block}
.mc .ab{font:600 11px/1.2 var(--f-mono);color:var(--g);letter-spacing:.02em}
.mc h3{font-size:16.5px;margin-top:3px}
.mc p{font-size:12.5px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mc .go{color:var(--muted)}
.empty{padding:24px 6px;color:var(--muted);font-size:14.5px}
.base{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.base summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px;font:600 16px/1.2 var(--f-display)}
.base summary::-webkit-details-marker{display:none}
.base summary .chev{margin-left:auto;transition:transform .25s;color:var(--muted)}
.base[open] summary .chev{transform:rotate(180deg)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 16px 16px}
@media (min-width:760px){ .facts{grid-template-columns:repeat(3,minmax(0,1fr))} }
.fact{background:var(--bg);border-radius:12px;padding:10px 12px;min-width:0}
.fact .big{font:600 20px/1.15 var(--f-mono);display:block}
.fact p{font-size:12.5px;color:var(--muted);margin-top:4px}
.foot{margin-top:28px;font-size:12.5px;color:var(--muted);max-width:80ch}

/* ---------- módulo ---------- */
.mod{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "bench" "secs";gap:16px}
@media (min-width:1000px){ .plate{max-width:min(400px,calc(100dvh - 410px))} .mod{grid-template-columns:minmax(0,1fr) minmax(340px,420px);grid-template-areas:"head bench" "secs bench";grid-template-rows:auto 1fr;column-gap:28px;row-gap:16px;align-items:start} .mod .bench{position:sticky;top:76px;max-height:calc(100dvh - 90px);overflow:auto} .mod .bench > *{flex-shrink:0} .normbar{top:calc(env(safe-area-inset-top,0px) + 57px)} }
.mhead{display:flex;flex-direction:column;gap:8px}
.mhead .kick{display:inline-flex;align-items:center;gap:8px;font:600 12px/1.3 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--g)}
.mhead .kick .tag{background:var(--g-soft);color:var(--g);border-radius:999px;padding:3px 9px;letter-spacing:.04em}
.mhead .lede{margin-top:0}
.orgs{display:flex;flex-wrap:wrap;gap:6px}
.org{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12.5px;font-style:italic;background:var(--surface)}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.bench-top{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface-2);padding:3px;gap:3px}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;padding:8px 8px;min-height:20px;border-radius:9px;font:600 13px/1.2 var(--f-body);color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.res button.p[aria-pressed="true"]{color:var(--pos)} .seg.res button.ng[aria-pressed="true"]{color:var(--neg)}
.seg button .ic{width:16px;height:16px;margin-right:4px;vertical-align:-3px}
.platewrap{position:relative}
.plate{width:100%;max-width:min(400px,calc(100dvh - 330px));min-width:220px;aspect-ratio:1;display:block;margin:0 auto}
.incub{position:absolute;right:6px;top:6px;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font:600 12px/1 var(--f-mono);color:var(--accent);opacity:0;transform:translateY(-4px);transition:opacity .3s,transform .3s}
.incub.on{opacity:1;transform:none}
.steps{display:flex;align-items:center;gap:6px}
.sdot{all:unset;cursor:pointer;flex:1;height:30px;display:flex;align-items:center}
.sdot span{display:block;width:100%;height:5px;border-radius:3px;background:var(--surface-2);transition:background .3s}
.sdot.done span{background:color-mix(in srgb,var(--g) 45%,var(--surface-2))}
.sdot.cur span{background:var(--g)}
.cap{background:var(--bg);border-radius:12px;padding:10px 12px;min-height:72px;font-size:14px}
.cap .st{display:block;font:600 11px/1.4 var(--f-mono);color:var(--g);letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px}
.ctrls{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;gap:8px}
.ctrls button{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:600 14px/1 var(--f-body)}
.ctrls button.play{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.ctrls button[disabled]{opacity:.35;cursor:default}
.dleg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 10px;font-size:13px}
.dleg .dk{font:600 11.5px/1.7 var(--f-mono);background:var(--surface-2);border-radius:6px;padding:0 7px;text-align:center}
.illus{font-size:11.5px;color:var(--muted)}
.ptx{font:600 3px var(--f-mono);fill:var(--plate-ink);paint-order:stroke;stroke:var(--plate-halo);stroke-width:.8px;stroke-linejoin:round}
.dtx{font:700 2.05px var(--f-mono);fill:var(--disk-ink);text-anchor:middle}
.dsk{fill:var(--disk);stroke:#9aa7a5;stroke-width:.25}
.dim{stroke:var(--plate-ink);stroke-width:.35;fill:none}
.dimx{stroke:var(--plate-ink);stroke-width:.25;stroke-dasharray:.8 .6;fill:none}
.scl{font:600 2.6px var(--f-mono);fill:var(--muted)}
.fab{all:unset;position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:25;cursor:pointer;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--surface);border-radius:999px;padding:11px 16px 11px 12px;font:600 14px/1 var(--f-body);box-shadow:0 10px 26px -8px rgba(0,0,0,.45);opacity:0;transform:translateY(16px) scale(.96);pointer-events:none;transition:opacity .25s,transform .25s}
.fab.show{opacity:1;transform:none;pointer-events:auto}
@media (min-width:1000px){ .fab{display:none} }

/* norma */
.normbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:5;background:var(--bg);padding:8px 0;display:flex;align-items:center;gap:10px}
.normbar .label{flex:none}
.normbar .seg{flex:1;max-width:340px}
.normbar .seg button[data-n="C"][aria-pressed="true"]{color:var(--clsi)} .normbar .seg button[data-n="E"][aria-pressed="true"]{color:var(--eucast)}
.content{min-width:0;display:flex;flex-direction:column;gap:10px}
.banner{border-radius:14px;padding:12px 14px;font-size:14px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.sec summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 14px;min-height:28px}
.sec summary::-webkit-details-marker{display:none}
.sec summary .si{width:36px;height:36px;border-radius:11px;background:var(--g-soft);color:var(--g);display:flex;align-items:center;justify-content:center;flex:none}
.sec summary h2{font-size:17px}
.sec summary .chev{margin-left:auto;color:var(--muted);transition:transform .25s}
.sec[open] summary .chev{transform:rotate(180deg)}
.sec .body{padding:0 14px 16px;display:flex;flex-direction:column;gap:10px;animation:up .3s ease-out}
.sec .body > p,.sec .body li{max-width:72ch}
/* filas CLSI / EUCAST */
.nt{display:flex;flex-direction:column;gap:10px}
.ntr{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;border-top:1px solid var(--line);padding-top:10px}
.ntr:first-child{border-top:0;padding-top:0}
.nth{font:600 14px/1.35 var(--f-body)}
.ntc{border-radius:10px;padding:8px 10px;font-size:14px;min-width:0;background:var(--bg)}
.ntc.c{border-left:3px solid var(--clsi)} .ntc.e{border-left:3px solid var(--eucast)} .ntc.b{border-left:3px solid var(--muted)}
.ntc .t{display:block;font:600 10.5px/1.4 var(--f-body);letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.ntc.c .t{color:var(--clsi)} .ntc.e .t{color:var(--eucast)} .ntc.b .t{color:var(--muted)}
.nt .nu{text-transform:none;letter-spacing:0}
[data-norma="C"] .ntc.e,[data-norma="E"] .ntc.c{display:none}
@media (min-width:760px){
  [data-norma="A"] .ntr{grid-template-columns:minmax(120px,22%) minmax(0,1fr) minmax(0,1fr)}
  [data-norma="A"] .ntr .ntc.b{grid-column:2 / 4}
  [data-norma="C"] .ntr,[data-norma="E"] .ntr{grid-template-columns:minmax(120px,26%) minmax(0,1fr)}
}
ol.steps-l{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
ol.steps-l li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;counter-increment:s;font-size:14.5px}
ol.steps-l li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--g-soft);color:var(--g);display:flex;align-items:center;justify-content:center;font:600 12.5px/1 var(--f-mono)}
.ir{display:flex;flex-direction:column;gap:8px}
.irow{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;background:var(--bg);border-radius:12px;padding:10px 12px}
.irow .a{font-weight:600;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.irow .a .ic{width:18px;height:18px;color:var(--g);margin-top:2px}
.irow .b{font-size:14px;color:var(--ink);padding-left:26px}
.rep{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:760px){ .rep{grid-template-columns:repeat(2,minmax(0,1fr))} }
.repc{border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.repc header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 8px 8px 12px}
.repc.p header{background:var(--pos-soft);color:var(--pos)} .repc.n header{background:var(--neg-soft);color:var(--neg)}
.repc header b{font:600 12px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.repc pre{margin:0;padding:12px;white-space:pre-wrap;word-break:break-word;font:400 13.5px/1.55 var(--f-body);flex:1}
.copy{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font:600 12.5px/1 var(--f-body);padding:9px 11px;border-radius:9px;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.copy.ok{color:var(--neg);border-color:var(--neg)}
ul.clean{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ul.clean li{position:relative;padding-left:20px;font-size:14px}
ul.clean li::before{content:"";position:absolute;left:4px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--g)}
ul.warnl li::before{background:var(--warn);border-radius:2px;transform:rotate(45deg)}
.v{display:inline-block;font:600 10.5px/1.5 var(--f-body);letter-spacing:.04em;text-transform:uppercase;padding:0 6px;border-radius:4px;vertical-align:1px;white-space:nowrap}
.v.chk{background:var(--warn-soft);color:var(--warn)} .v.lit{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

.nextprev{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}
.np{all:unset;cursor:pointer;box-sizing:border-box;display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;min-width:0}
.np.r{text-align:right;align-items:flex-end}
.np small{font:600 11px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.np b{font:600 15px/1.25 var(--f-display)}

/* ---------- por bacteria ---------- */
.olist{display:flex;flex-direction:column;gap:10px}
.oc{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.oc summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 14px}
.oc summary::-webkit-details-marker{display:none}
.oc .og{width:40px;height:40px;border-radius:12px;background:var(--g-soft);color:var(--g);display:flex;align-items:center;justify-content:center;flex:none}
.oc .og svg{width:30px;height:30px}
.oc summary b{font:600 15px/1.3 var(--f-body);font-style:italic}
.oc summary small{display:block;font-size:12px;color:var(--muted);font-style:normal}
.oc summary .chev{margin-left:auto;color:var(--muted);transition:transform .25s;flex:none}
.oc[open] summary .chev{transform:rotate(180deg)}
.oc .body{padding:0 12px 14px;display:flex;flex-direction:column;gap:8px;animation:up .3s ease-out}
.rec{all:unset;cursor:pointer;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:10px 12px}
.rec b{font:600 14.5px/1.3 var(--f-body)} .rec p{font-size:13px;color:var(--muted);margin-top:2px}
.rec .go{color:var(--g)}
.off{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:8px 12px}

/* ---------- fuentes ---------- */
ol.src{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
ol.src li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;scroll-margin-top:90px;transition:box-shadow .3s,border-color .3s}
ol.src li.hl{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
ol.src .id{font:600 13px/1.5 var(--f-mono);color:var(--accent)}
ol.src .t{font-weight:600;font-size:14.5px}
ol.src .m{font-size:13px;color:var(--muted);margin-top:3px}
ol.src a{word-break:break-all;font-size:12.5px;display:inline-block;margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--surface);border-radius:12px;padding:10px 14px;font:600 13.5px/1.3 var(--f-body);opacity:0;transition:opacity .25s,transform .25s;z-index:40;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<script>
(function(){
"use strict";
/* ================= FUENTES ================= */
const SRC = {
 R1:{t:"EUCAST. Breakpoint tables for interpretation of MICs and zone diameters, versión 16.1 (vigente desde 24-06-2026).",m:"Leído en el documento completo (copia aportada para este proyecto): condiciones de prueba, puntos de corte y notas de Enterobacterales, Pseudomonas, Staphylococcus (cefoxitina, oxacilina, bencilpenicilina y borde del halo, prueba D), Enterococcus (vancomicina, HLAR), estreptococos A, B, C y G, S. pneumoniae (diagrama de oxacilina) y H. influenzae (diagrama de bencilpenicilina).",u:"https://www.eucast.org/fileadmin/eucast/pdf/breakpoints/v_16.1_Breakpoint_Tables.pdf"},
 R2:{t:"EUCAST. Guidelines for detection of resistance mechanisms and specific resistances of clinical and/or epidemiological importance, versión 2.01 (julio 2017).",m:"Sigue siendo la versión vigente publicada por EUCAST; cotejada con la copia oficial aportada por el usuario. Secciones 2 (carbapenemasas), 3 (BLEE), 4 (AmpC adquirida), 6 (P. aeruginosa/Acinetobacter), 7 (SARM). Leído en el documento original.",u:"https://www.eucast.org/bacteria/important-additional-information/resistance-detection/"},
 R3:{t:"EUCAST. Disk Diffusion Method for Antimicrobial Susceptibility Testing (manual) y EUCAST Reading Guide for disk diffusion.",m:"Método 15-15-15, profundidad del agar, MH-F, lectura; distancia eritromicina–clindamicina 12–20 mm (estafilococos) y 12–16 mm (estreptococos) borde a borde.",u:"https://www.eucast.org/ast_of_bacteria/disk_diffusion_methodology/"},
 R4:{t:"CLSI. M100 Performance Standards for Antimicrobial Susceptibility Testing, 36.ª ed. Clinical and Laboratory Standards Institute; 2026.",m:"Verificado en el documento original: Tabla 1A-1 (notas b y c), Tabla 2A-1 (condiciones, comentarios 15, 16, 19 y 26; cefalosporinas y carbapenémicos), Tabla 2B-1 (carbapenémicos), Tabla 2C (condiciones, comentarios 2, 6, 10–13; cefoxitina y oxacilina), Tabla 2D (enterococos), Tabla 2E (H. influenzae), Tabla 2G (S. pneumoniae), Tabla 2H-1 (condiciones), Tablas 3A (BLEE), 3G (β-lactamasa en estafilococos), 3J (prueba D) y 3L (HLAR), Tablas 4A-1 y 4B (rangos de control), Apéndice G (Tabla G3 y comentarios). Para el intérprete y las fichas: Tablas 1A-1 a 1H-2 (paneles por niveles y reglas de informe por sitio), todas las filas de disco de las Tablas 2A-1 a 2H-2 y Apéndice B (resistencia intrínseca).",u:"https://clsi.org/shop/standards/m100/"},
 R5:{t:"Servicio Antimicrobianos, INEI-ANLIS «Dr. Carlos G. Malbrán» (LNR, Argentina). Protocolo de trabajo Red WHONET Argentina, vigencia 2019.",m:"Disposición de discos de EDTA y ácido borónico, fórmula de distancia ajustada, AmpC plasmídica (FOX–APB–CTX), prueba D, cefoxitina en estafilococos, control de calidad del medio (Zn²⁺). Basado en CLSI M100-S28.",u:"https://antimicrobianos.com.ar/ATB/wp-content/uploads/2020/12/Protocolo-WHONET-aprobado-2019-vfinal.pdf"},
 R6:{t:"Instituto de Salud Pública de Chile. Recomendaciones para detección de carbapenemasas en enterobacterias y Pseudomonas aeruginosa (Res. Exenta N.º 823, 2018).",m:"Test de ácido borónico (disco 300 µg), test EDTA (750 µg EDTA + 1900 µg SMA, 15 mm), fenotipos en P. aeruginosa, control de calidad; puntos de corte citados de CLSI 2017.",u:"https://www.ispch.cl/sites/default/files/Recomendaciones%20para%20detecci%C3%B3n%20carbapenemasas%20en%20enterobacterias%20y%20pseudomonas%20aeruginosa..pdf"},
 R7:{t:"Dunne WM Jr, Hardin DJ. Use of several inducer and substrate antibiotic combinations in a disk approximation assay format to screen for AmpC induction… J Clin Microbiol. 2005;43(12):5945-9.",m:"Combinaciones imipenem/cefotaxima, imipenem/ceftazidima; discos a 25 mm centro a centro; E. coli ATCC 25922 como control negativo.",u:"https://journals.asm.org/doi/10.1128/jcm.43.12.5945-5949.2005"},
 R8:{t:"A clinically relevant reinterpretation of disk approximation testing for inducible AmpC in Pseudomonas aeruginosa (2025).",m:"Ceftazidima 30 µg e imipenem 10 µg a 20 mm borde a borde; inducibilidad definida convencionalmente como aplanamiento ≥5 mm del halo de ceftazidima junto al imipenem.",u:"https://pmc.ncbi.nlm.nih.gov/articles/PMC12707433/"},
 R9:{t:"Infectious Diseases Society of America. IDSA Guidance on the Treatment of Antimicrobial-Resistant Gram-Negative Infections (versión 2024, actualizada 2026).",m:"AmpC-E: E. cloacae complejo, K. aerogenes, C. freundii (y H. alvei) con riesgo moderado de AmpC clínicamente significativa; no se sugiere ceftriaxona para infecciones invasivas; no existen métodos avalados por CLSI para detectar AmpC.",u:"https://www.idsociety.org/practice-guideline/amr-guidance/"},
 R10:{t:"Steward CD, et al. Testing for induction of clindamycin resistance in erythromycin-resistant isolates of Staphylococcus aureus. J Clin Microbiol. 2005;43(4):1716-21.",m:"Distancia 15–26 mm (NCCLS/CLSI); cepas control S. aureus ATCC BAA-977 (ermA, D positivo) y BAA-976 (msrA, D negativo).",u:"https://pmc.ncbi.nlm.nih.gov/articles/PMC1081368/"},
 R11:{t:"Instituto Nacional de Salud (Perú). Caracterización molecular de carbapenemasas en el Perú durante el 2019. Bol Inst Nac Salud. 2021.",m:"185 cepas con carbapenemasas de clases A, B y D confirmadas por el Laboratorio de Referencia Nacional de Infecciones Intrahospitalarias (INS).",u:"http://www.scielo.org.pe/scielo.php?script=sci_arttext&pid=S1726-46342021000100113"},
 R12:{t:"CDC-MINSA Perú. Alerta epidemiológica AE-CDC N.º 007-2024: K. pneumoniae hipervirulenta portadora de genes de carbapenemasas.",m:"Refuerza vigilancia y derivación de cepas al Laboratorio de Referencia Nacional de Bacteriología Clínica (INS).",u:"https://cdn.www.gob.pe/uploads/document/file/6973688/4752905-ae-cdc-n-007-2024_riesgo-de-infecciones-asociadas-a-la-atencion-de-la-salud-causadas-por-klebsiella-pneumoniae-hipervirulenta-portadora-de-genes-de-carbapenemasas.pdf?v=1726861970"},
 R14:{t:"Tan TY, et al. Evaluation of screening methods to detect plasmid-mediated AmpC in E. coli, K. pneumoniae and P. mirabilis. Antimicrob Agents Chemother. 2009;53:146-9.",m:"La aproximación de discos detectó solo 25 % de las AmpC plasmídicas (especificidad 99 %); los discos con inhibidor rindieron mejor.",u:"https://journals.asm.org/doi/10.1128/aac.00862-08"},
 R15:{t:"CLSI. M02 Performance Standards for Antimicrobial Disk Susceptibility Tests, 14.ª ed. (2024).",m:"Método de referencia de difusión en disco. No se consultó el texto original; los datos que dependen solo del M02 llevan la marca «verificar».",u:"https://clsi.org/shop/standards/m02/"},
 R18:{t:"EUCAST. Phenotypic screening tests to detect/exclude resistance of clinical relevance (publicado 01-12-2021; revisión 22-08-2022).",m:"Leído en el documento original. Cómo informar un tamizaje; cefoxitina 30 µg para estafilococos salvo S. pseudintermedius, S. schleiferi y S. coagulans (oxacilina 1 µg); eritromicina 15 µg como tamizaje de macrólidos; oxacilina 1 µg en S. pneumoniae.",u:"https://www.eucast.org/eucastguidancedocuments/"},
};
const ORDER = Object.keys(SRC);
const r = (...ids) => `<sup class="ref">[${ids.map(i=>`<a data-ref="${i}" title="${SRC[i].t.replace(/"/g,'&quot;')}">${ORDER.indexOf(i)+1}</a>`).join(",")}]</sup>`;
const CHK = `<span class="v chk" title="Confirmar en CLSI M100 Ed36">verificar</span>`;
const LIT = `<span class="v lit" title="Procede de la literatura, no de CLSI ni EUCAST">literatura</span>`;
const CHKM = `<span class="v chk" title="Dato del CLSI M02, que no se consultó">verificar M02</span>`;
const CLSI_CARBA = `Resistente a cualquier carbapenémico ensayado (ertapenem, imipenem o meropenem): estudiar carbapenemasa con métodos fenotípicos o moleculares. Excepción: <i>Proteus</i>, <i>Providencia</i> y <i>Morganella</i> resistentes solo a imipenem. En <i>E. cloacae</i> complejo y <i>K. aerogenes</i> resistentes solo a ertapenem puede no ser necesario (Tabla 2A-1, comentario 26)${r("R4")}.<br>Disco 10 µg: ertapenem S ≥22 · I 19–21 · R ≤18 mm; imipenem y meropenem S ≥23 · I 20–22 · R ≤19 mm${r("R4")}. Las redes de la región usan además imipenem &lt;22 mm como tamizaje${r("R5")}.`;
const CLSI_PAE = `Imipenem y meropenem 10 µg: S ≥19 · I 16–18 · R ≤15 mm (Tabla 2B-1)${r("R4")}. Para <i>P. aeruginosa</i> la M100 describe Carba NP y mCIM (Tablas 3B y 3C), no pruebas de discos con inhibidores${r("R4")}.`;
const CLSI_CARBA_REP = [
  `<b>CLSI:</b> la detección de carbapenemasa no reemplaza el antibiograma, pero orienta el tratamiento y las medidas de control de infecciones; cómo probar e informar se decide con el equipo de uso de antimicrobianos (Tabla 2A-1, comentario 26)${r("R4")}.`,
  `<b>CLSI:</b> con carbapenemasa detectada, un resultado de cefepima S o SDD se suprime o se informa resistente (Tabla 2A-1, comentario 19; Tabla G3). Si un carbapenémico o una cefalosporina de 3.ª generación sale sensible pese a la carbapenemasa, se informa con un comentario de precaución: la evidencia actual no permite asegurar que el tratamiento sea eficaz (Apéndice G, Tabla G3)${r("R4")}.`
];

/* ================= PASOS COMUNES DE LA ANIMACIÓN ================= */
const S_MH = "Placa de agar Mueller-Hinton, profundidad 4,0 ± 0,5 mm, superficie seca.";
const S_INOC = "Inóculo 0,5 McFarland. Sembrar con hisopo en tres direcciones, girando la placa unos 60° cada vez, sin dejar espacios.";

/* ================= MÓDULOS ================= */
const MODS = [
/* ---------------- MBL ---------------- */
{ id:"mbl", ab:"EDTA", nav:"MBL · EDTA",
  title:"Metalo-β-lactamasas con EDTA",
  kicker:"Carbapenemasas clase B · NDM, VIM, IMP",
  lede:"Las metalo-β-lactamasas necesitan zinc para funcionar. El EDTA secuestra el zinc y las inhibe: junto al disco de EDTA el carbapenémico recupera actividad y su halo se ensancha hacia el EDTA. Hidrolizan penicilinas, cefalosporinas y carbapenémicos, pero no el aztreonam."+r("R2","R6"),
  orgs:["Enterobacterales","Pseudomonas aeruginosa","Acinetobacter (orientativo)"],
  when:{rows:[
    ["Enterobacterales",CLSI_CARBA,`Meropenem 10 µg &lt;28 mm (CIM &gt;0,125 mg/L). Entre 25 y 27 mm, investigar solo si hay resistencia a piperacilina-tazobactam y/o temocilina; con &lt;25 mm, investigar siempre${r("R1","R2")}.`],
    ["P. aeruginosa",CLSI_PAE,`Sin punto de tamizaje específico. Puntos de corte (disco 10 µg): meropenem S ≥20 · R &lt;14 mm; imipenem R &lt;20 mm (S ≥50: en la práctica, I con dosis alta)${r("R1")}. EUCAST advierte que las pruebas con discos e inhibidores tienen baja especificidad en esta especie y sugiere confirmación molecular${r("R2")}.`]
  ]},
  mat:[
    ["Medio",`Mueller-Hinton, ≈4 mm de profundidad${r("R15")}`,`Mueller-Hinton, 4,0 ± 0,5 mm${r("R3")}`],
    ["Discos",{span:`Imipenem 10 µg · Meropenem 10 µg · disco de EDTA. Disco de preparación local: 750 µg de EDTA + 1900 µg de mercaptoacetato de sodio (SMA) por disco${r("R5","R6")}.`}],
    ["Disposición",{span:`EDTA entre imipenem y meropenem, a <b>15 mm centro a centro</b>${r("R6")}. En <i>P. aeruginosa</i>: a 1 cm del borde del disco de imipenem (≈15 mm c-c)${r("R5")}. En el antibiograma inicial de enterobacterias se puede colocar el EDTA a 20 mm entre cefotaxima y meropenem${r("R5")}.`}],
    ["Formato alternativo","—",`Discos combinados meropenem 10 µg ± ácido dipicolínico (DPA) o EDTA (kits comerciales). El criterio de sinergia en mm lo fija el fabricante${r("R2")}.`],
    ["Incubación",`35 ± 2 °C, aire, 16–18 h (Tabla 2A-1)${r("R4")}`,`35 ± 1 °C, aire, 18 ± 2 h${r("R1")}`]
  ],
  plate:[{ agar:"mh", disks:[{c:"IMP",x:-15,y:0,n:"Imipenem",l:"10 µg"},{c:"EDTA",x:0,y:0,n:"EDTA/SMA",l:"750/1900 µg"},{c:"MER",x:15,y:0,n:"Meropenem",l:"10 µg"}],
    ruler:{x1:-15,x2:0,y:0,off:-12,t:"15 mm c-c"},
    res:{
      pos:{zones:[{d:"IMP",r:8,egg:{to:"EDTA",ext:4.5}},{d:"MER",r:8,egg:{to:"EDTA",ext:4.5}}],note:{x:-6.5,y:2.5,tx:-40,ty:24,t:"halo ensanchado hacia EDTA"}},
      neg:{zones:[{d:"IMP",r:8},{d:"MER",r:8.5}],note:{x:-8,y:6,tx:-40,ty:24,t:"halos circulares"}}
    },
    steps:[S_MH,S_INOC,"Colocar imipenem, EDTA y meropenem dentro de los 15 minutos, con el EDTA en el medio a 15 mm de cada carbapenémico. Presionar cada disco para que quede en contacto con el agar.","Incubar invertida a 35 °C en aire, 16–18 h (CLSI) o 18 ± 2 h (EUCAST). No apilar más de 5 placas.",
      "Positivo: los halos de imipenem y meropenem se deforman y crecen hacia el EDTA («efecto huevo»). Fenotipo compatible con metalo-β-lactamasa.",
      "Negativo: los halos son circulares y no cambian del lado del EDTA. Si el halo es pequeño, repetir con la distancia ajustada."]
  }],
  read:[
    "Leer por el reverso de la placa, sobre fondo oscuro y con luz reflejada"+r("R3")+".",
    "Comparar el borde del halo del carbapenémico del lado que mira al EDTA con el lado opuesto.",
    "<b>Positivo:</b> el halo se ensancha o se deforma hacia el EDTA, o aparece una zona de inhibición entre ambos discos.",
    "<b>Negativo:</b> halos circulares. Si el halo del carbapenémico es pequeño y el disco quedó lejos, la sinergia puede no verse: repetir con la distancia ajustada (radio del halo + radio del disco inhibidor + 5 mm)"+r("R5")+".",
    "En <i>P. aeruginosa</i> el EDTA tiene actividad propia y la prueba es poco específica: tomar el resultado como orientativo"+r("R2")+"."
  ],
  interp:[
    ["Sinergia con EDTA, sin sinergia con ácido borónico","Metalo-β-lactamasa probable (NDM, VIM, IMP)."],
    ["Sinergia con EDTA y con ácido borónico","Posible coproducción MBL + KPC. En Perú se han confirmado dobles carbapenemasas; requiere confirmación molecular"+r("R2","R11")+"."],
    ["Carbapenémico afectado, sin sinergia con ningún inhibidor","Otra carbapenemasa sin inhibidor en disco (OXA-48, OXA-163) o mecanismo no enzimático (BLEE o AmpC con pérdida de porinas). Ver la tabla combinada del módulo KPC"+r("R2","R5")+"."],
    ["Fenotipo MBL con aztreonam sensible","Compatible con MBL sola, que no hidroliza aztreonam. Con frecuencia coexiste una BLEE que sí lo afecta"+r("R2")+"."]
  ],
  report:{
    pos:"Fenotipo compatible con carbapenemasa tipo metalo-β-lactamasa (sinergia carbapenémico–EDTA).\nResultado presuntivo: cepa remitida al laboratorio de referencia para confirmación.\nSe comunicó al equipo de prevención y control de infecciones (IAAS).\nCarbapenémicos informados según los puntos de corte vigentes. La respuesta clínica a carbapenémicos puede estar comprometida aun con categoría S o I.",
    neg:"No se observa sinergia con EDTA: no se detecta fenotipo de metalo-β-lactamasa.\n(Si el carbapenémico sigue no sensible, investigar otra carbapenemasa o mecanismo no enzimático.)",
    notes:[
      ...CLSI_CARBA_REP,
      `<b>EUCAST:</b> la detección no cambia la categoría. Si se detecta una carbapenemasa, la respuesta a carbapenémicos (sin un inhibidor activo frente a esa enzima) puede estar comprometida aun con S o I; se prefieren otros antimicrobianos${r("R1")}.`,
      `Ceftazidima-avibactam no es activa frente a MBL${r("R5")}.`,
      `Perú: remitir la cepa al Laboratorio de Referencia Nacional del INS según las disposiciones de su DIRESA/GERESA y avisar al comité de IAAS${r("R11","R12")}.`
    ]},
  limits:[
    "Agar con poco zinc: halos de carbapenémico más grandes y sinergia ausente (falso negativo). Controlar cada lote nuevo de Mueller-Hinton con una cepa MBL conocida"+r("R5")+".",
    "<i>P. aeruginosa</i>: especificidad baja de los discos con EDTA; confirmar con método colorimétrico o molecular"+r("R2")+".",
    "<i>Acinetobacter</i>: la resistencia a carbapenémicos se debe casi siempre a OXA carbapenemasas, que no tienen inhibidor en disco; el EDTA solo orienta hacia MBL"+r("R2","R5")+".",
    "La coproducción de dos carbapenemasas puede anular la sinergia"+r("R2")+".",
    "Test de Hodge: no recomendado, difícil de interpretar y poco específico"+r("R2")+"."
  ],
  qc:`Controles positivos sugeridos por EUCAST (sin rangos): <i>K. pneumoniae</i> NCTC 13440 (VIM), NCTC 13443 (NDM-1), <i>E. coli</i> NCTC 13476 (IMP); negativo <i>K. pneumoniae</i> ATCC 25955; <i>P. aeruginosa</i> NCTC 13437 (VIM-10)${r("R2")}. Cada lote de discos de EDTA preparados en el laboratorio se controla con una cepa positiva y otra negativa; conservar a −20 °C con desecante${r("R6")}. El zinc del medio se vigila con <i>P. aeruginosa</i> ATCC 27853 frente a imipenem dentro de rango${r("R5")}.`
},
/* ---------------- KPC ---------------- */
{ id:"kpc", ab:"APB", nav:"KPC · ác. borónico",
  title:"Carbapenemasas tipo KPC con ácido borónico",
  kicker:"Carbapenemasas clase A · KPC, GES, SME, IMI",
  lede:"El ácido 3-aminofenilborónico (APB) inhibe las carbapenemasas de clase A como KPC. Junto al disco de APB, imipenem y meropenem recuperan actividad y su halo se ensancha. El APB también inhibe AmpC, por eso el resultado se interpreta según la especie o junto con cloxacilina."+r("R2","R6"),
  orgs:["Klebsiella","Enterobacterales","Pseudomonas aeruginosa"],

const PR = 45; let token = 0; let uidN = 0;
const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function diskById(v, c){ return v.disks.find(d=>d.c===c); }
function zoneShapes(v, z){
  const d = diskById(v, z.d); let s = "";
  if(z.blunt){
    const t = diskById(v, z.blunt.to); const ux=t.x-d.x, uy=t.y-d.y, L=Math.hypot(ux,uy); const u=[ux/L,uy/L]; const h=z.r - z.blunt.cut;
    const pts=[]; for(let i=0;i<96;i++){ const a=i/96*Math.PI*2; let px=d.x+z.r*Math.cos(a), py=d.y+z.r*Math.sin(a); const proj=(px-d.x)*u[0]+(py-d.y)*u[1]; if(proj>h){ px-=u[0]*(proj-h); py-=u[1]*(proj-h);} pts.push(px.toFixed(2)+","+py.toFixed(2)); }
    s += `<polygon points="${pts.join(" ")}"/>`;
  } else if(z.fuzzy){
    const gid = "fz"+(++uidN); const k = Math.max(0,(z.r-z.fuzzy)/z.r).toFixed(3);

  q.addEventListener("input",()=>{ QUERY=q.value; sb.classList.toggle("has",!!QUERY); drawList(); });
  document.getElementById("qx").addEventListener("click",e=>{ e.preventDefault(); QUERY=""; q.value=""; sb.classList.remove("has"); drawList(); q.focus(); });
  view.querySelector(".chips").addEventListener("click",e=>{ const b=e.target.closest("[data-g]"); if(!b) return; FILTER=b.dataset.g; store("dgm-f",FILTER); view.querySelectorAll(".fchip").forEach(x=>x.setAttribute("aria-pressed",x===b)); drawList(); });
  drawList();
}
function drawList(){
  const box=document.getElementById("list"); if(!box) return;
  const toks = norm(QUERY).split(/\s+/).filter(Boolean);
  const ok = id => (FILTER==="all"||groupOf(id)===FILTER) && toks.every(t=>INDEX.find(x=>x.id===id).x.includes(t));
  if(!toks.length && FILTER==="all"){
    box.innerHTML = Object.entries(GRP).map(([g,G])=>`<section class="grp" style="${gStyle(g)}"><div class="grp-h"><span class="bar"></span><h2>${G.n}</h2><span class="sub">${G.sub}</span></div><div class="cards enter">${G.ids.map(id=>card(MODS.find(m=>m.id===id))).join("")}</div></section>`).join("");
  } else {
    const ids = ALL.filter(ok);
    box.innerHTML = ids.length ? `<div class="cards enter" style="margin-top:14px">${ids.map(id=>card(MODS.find(m=>m.id===id))).join("")}</div>` : `<p class="empty">Ninguna prueba coincide con «${esc(QUERY)}». Prueba con un antibiótico (cefoxitina), una bacteria (Klebsiella) o un mecanismo (KPC).</p>`;
  }
}

/* ================= MÓDULO ================= */
let NORMA = store("dgm-n") || "A";
let PS = null; let fabObs = null; const fab = document.getElementById("fab");
const STEPN = ["Agar","Siembra","Discos","Incubación","Lectura"];
function cells(r){
  if(typeof r[1]==="object" && r[1] && r[1].span!==undefined) return `<div class="ntc b"><span class="t">CLSI y EUCAST</span>${r[1].span}</div>`;
  return `<div class="ntc c"><span class="t">CLSI</span>${r[1]}</div><div class="ntc e"><span class="t">EUCAST</span>${r[2]}</div>`;
}
function normTable(rows, head){
  return `<div class="nt">${rows.map(r=>{ let c=cells(r); if(head){ c=c.replace('<span class="t">CLSI</span>',`<span class="t">${head[1]}</span>`).replace('<span class="t">EUCAST</span>',`<span class="t">${head[2]}</span>`); } return `<div class="ntr"><div class="nth">${r[0]}</div>${c}</div>`; }).join("")}</div>`;
}
function sec(id, ic, t, body, open){ return `<details class="sec" id="s-${id}"${open?" open":""}><summary><span class="si">${icon(ic)}</span><h2>${t}</h2>${icon("chev","ic chev")}</summary><div class="body">${body}</div></details>`; }
function renderModule(m){
  const g = groupOf(m.id); const k = ALL.indexOf(m.id);
  let vIdx = 0; const sv = store("dgm-v-"+m.id); if(sv!=null && m.plate[+sv]) vIdx = +sv;
  PS = {m, vIdx, res:"pos", k:4};
  const prev = MODS.find(x=>x.id===ALL[(k-1+ALL.length)%ALL.length]), next = MODS.find(x=>x.id===ALL[(k+1)%ALL.length]);
  view.innerHTML = `<div class="mod" style="${gStyle(g)}" data-norma="${NORMA}">
    <header class="mhead enter" style="grid-area:head">
      <div class="kick"><span class="tag">${GRP[g].n}</span><span class="mono">${m.ab}</span></div>
      <h1>${m.title}</h1><p class="lede">${m.lede}</p>
      <div class="orgs">${m.orgs.map(o=>`<span class="org">${o}</span>`).join("")}</div>
    </header>
    <aside class="bench" id="bench" style="grid-area:bench" aria-label="Placa animada">
      <div class="bench-top">
        ${m.plate.length>1?`<div class="seg" role="group" aria-label="Variante">${m.plate.map((p,i)=>`<button type="button" data-var="${i}" aria-pressed="${i===vIdx}">${p.name}</button>`).join("")}</div>`:""}
        <div class="seg res" role="group" aria-label="Resultado"><button type="button" class="p" data-res="pos" aria-pressed="true">${icon("plus")}Positivo</button><button type="button" class="ng" data-res="neg" aria-pressed="false">${icon("minus")}Negativo</button></div>
      </div>
      <div class="platewrap"><div id="plateBox"></div><span class="incub" id="incub">${icon("clock")}35 °C</span></div>
      <div class="steps" role="group" aria-label="Pasos">${STEPN.map((s,i)=>`<button class="sdot" type="button" data-step="${i}" aria-label="Paso ${i+1}: ${s}"><span></span></button>`).join("")}</div>
      <div class="cap" id="cap" aria-live="polite"></div>
      <div class="ctrls"><button type="button" id="sPrev" aria-label="Paso anterior">${icon("left")}</button><button type="button" class="play" id="sPlay">${icon("play")}<span>Ver montaje</span></button><button type="button" id="sNext" aria-label="Paso siguiente">${icon("right")}</button></div>
      <div class="dleg" id="dleg"></div>
      <span class="illus">Placa de 90 mm a escala · diámetros ilustrativos</span>
    </aside>
    <div class="content" style="grid-area:secs">
      ${m.banner?`<div class="banner">${m.banner}</div>`:""}
      <div class="normbar"><span class="label">Norma</span><div class="seg" role="group" aria-label="Norma">${[["A","Ambas"],["C","CLSI"],["E","EUCAST"]].map(([k2,t])=>`<button type="button" data-n="${k2}" aria-pressed="${NORMA===k2}">${t}</button>`).join("")}</div></div>
      ${sec("when","clock","Cuándo hacerla", normTable(m.when.rows), true)}
      ${m.bp?sec("bp","ruler","Puntos de corte", normTable(m.bp.rows, m.bp.head)):""}
      ${sec("mat","flask","Materiales y disposición", normTable(m.mat))}
      ${sec("read","eye","Cómo se lee", `<ol class="steps-l">${m.read.map(x=>`<li><span>${x}</span></li>`).join("")}</ol>`)}
      ${sec("interp","bulb", m.interpTitle||"Qué podemos suponer", `<div class="ir">${m.interp.map(r=>`<div class="irow"><div class="a">${icon("arrow")}<span>${r[0]}</span></div><div class="b">${r[1]}</div></div>`).join("")}</div>`)}
      ${sec("rep","clip","Cómo informar", `<p class="illus">Textos sugeridos; adáptalos al formato de tu servicio.</p><div class="rep">
          <div class="repc p"><header><b>${icon("plus")}Si es positivo</b><button class="copy" type="button" data-copy="p">${icon("copy")}Copiar</button></header><pre id="rep-p">${esc(m.report.pos)}</pre></div>
          <div class="repc n"><header><b>${icon("minus")}Si es negativo</b><button class="copy" type="button" data-copy="n">${icon("copy")}Copiar</button></header><pre id="rep-n">${esc(m.report.neg)}</pre></div>
        </div><ul class="clean">${m.report.notes.map(n=>`<li>${n}</li>`).join("")}</ul>`)}
      ${sec("lim","alert","Limitaciones", `<ul class="clean warnl">${m.limits.map(x=>`<li>${x}</li>`).join("")}</ul>`)}
      ${sec("qc","shield","Control de calidad", `<p>${m.qc}</p>`)}
      <nav class="nextprev" aria-label="Otras pruebas"><button class="np" type="button" data-go="${prev.id}"><small>← Anterior</small><b>${prev.nav}</b></button><button class="np r" type="button" data-go="${next.id}"><small>Siguiente →</small><b>${next.nav}</b></button></nav>
    </div></div>`;
  const root = view.querySelector(".mod");
  root.querySelector(".bench").addEventListener("click", e=>{
    const vb=e.target.closest("[data-var]"), rb=e.target.closest("[data-res]"), sd=e.target.closest("[data-step]");
    if(vb){ PS.vIdx=+vb.dataset.var; store("dgm-v-"+m.id, vb.dataset.var); root.querySelectorAll("[data-var]").forEach(b=>b.setAttribute("aria-pressed",b===vb)); buildPlate(); }
    if(rb){ PS.res=rb.dataset.res; root.querySelectorAll("[data-res]").forEach(b=>b.setAttribute("aria-pressed",b===rb)); buildPlate(); }
    if(sd){ stepTo(+sd.dataset.step, false); }
    if(e.target.closest("#sPlay")) play();
    if(e.target.closest("#sNext") && PS.k<4) stepTo(PS.k+1, true);
    if(e.target.closest("#sPrev") && PS.k>0) stepTo(PS.k-1, false);
  });
  root.querySelector(".normbar").addEventListener("click", e=>{ const b=e.target.closest("[data-n]"); if(!b) return; NORMA=b.dataset.n; store("dgm-n",NORMA); root.dataset.norma=NORMA; root.querySelectorAll("[data-n]").forEach(x=>x.setAttribute("aria-pressed",x===b)); });
  root.addEventListener("click", e=>{ const b=e.target.closest("button.copy"); if(!b) return; const pre=document.getElementById("rep-"+b.dataset.copy); const txt=pre.textContent;
    const done=()=>{ b.classList.add("ok"); b.innerHTML=icon("check")+"Copiado"; toast("Texto copiado"); setTimeout(()=>{ b.classList.remove("ok"); b.innerHTML=icon("copy")+"Copiar"; },1600); };
    const fallback=()=>{ const rg=document.createRange(); rg.selectNodeContents(pre); const s=getSelection(); s.removeAllRanges(); s.addRange(rg); toast("Texto seleccionado: usa Copiar del sistema"); };
    try{ navigator.clipboard.writeText(txt).then(done,fallback); }catch(err){ fallback(); } });
  buildPlate();
  // botón flotante para volver a la placa en teléfonos
  if("IntersectionObserver" in window){ const bench=document.getElementById("bench"); fabObs=new IntersectionObserver(([en])=>{ fab.classList.toggle("show", !en.isIntersecting && en.boundingClientRect.top<0 && innerWidth<1000); }); fabObs.observe(bench); }
}
fab.addEventListener("click",()=>{ const b=document.getElementById("bench"); if(b) b.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"}); });

/* ---- placa por pasos ---- */
function curV(){ return PS.m.plate[PS.vIdx]; }
function legendHTML(v){ return v.disks.map(d=>`<span class="dk">${d.c}</span><span>${d.n} · <span class="mono">${d.l}</span></span>`).join(""); }
function buildPlate(){
  token++;
  const v=curV(); const box=document.getElementById("plateBox"); box.innerHTML=plateSVG(v);
  setZones(box.querySelector("svg"), v, PS.res, 1);
  document.getElementById("dleg").innerHTML=legendHTML(v);
  visual(PS.k); ui(PS.k);
}
function svgEl(){ return document.querySelector("#plateBox svg"); }
function visual(k){
  const svg=svgEl(), v=curV(); if(!svg) return;
  svg.querySelector(".lawn").setAttribute("opacity", k>=1?1:0);
  const sw=svg.querySelector(".swabs"); sw.setAttribute("opacity",0);
  svg.querySelectorAll(".disk").forEach(d=>{ d.setAttribute("opacity", k>=2?1:0); d.setAttribute("transform",`translate(${d.dataset.x} ${d.dataset.y})`); });
  const ru=svg.querySelector(".ruler"); if(ru) ru.setAttribute("opacity", k>=2?1:0);
  scaleZones(svg, k<3?0.001:(k===3?0.55:1));
  const ex=svg.querySelector(".extra"); ex.innerHTML = k===4?extraFor(v,PS.res):""; ex.setAttribute("opacity",1);
}
function ui(k){
  const v=curV();
  const text = k<4 ? v.steps[k] : v.steps[PS.res==="pos"?4:5];
  const lab = k<4 ? `Paso ${k+1} de 5 · ${STEPN[k]}` : `Lectura · ${PS.res==="pos"?"positivo":"negativo"}`;
  document.getElementById("cap").innerHTML = `<span class="st">${lab}</span>${text}`;
  document.querySelectorAll(".sdot").forEach((d,i)=>{ d.classList.toggle("cur",i===k); d.classList.toggle("done",i<k); d.setAttribute("aria-current", i===k?"step":"false"); });
  document.getElementById("incub").classList.toggle("on", k===3);
  document.getElementById("sPrev").disabled = k===0; document.getElementById("sNext").disabled = k===4;
  document.querySelector("#sPlay span").textContent = k===4||k===0 ? "Ver montaje" : "Seguir";
}
function stepTo(k, animate){ const my=++token; PS.k=k; ui(k); if(animate && !reduce){ visual(k-1); seg(k,my); } else visual(k); }
async function seg(k, my){
  const svg=svgEl(), v=curV(); const alive=()=>my===token;
  if(k===1){ const sw=svg.querySelector(".swabs"); sw.setAttribute("opacity",1); const lawn=svg.querySelector(".lawn"); lawn.setAttribute("opacity",0);
    const ps=[...sw.querySelectorAll("path")]; ps.forEach(p=>{ const L=p.getTotalLength(); p.style.strokeDasharray=L; p.style.strokeDashoffset=L; });
    for(const p of ps){ const L=+String(p.style.strokeDasharray).replace("px",""); await tween(520,t=>p.style.strokeDashoffset=L*(1-t),my); if(!alive()) return; }
    await tween(420,t=>{ lawn.setAttribute("opacity",t); sw.setAttribute("opacity",1-t); },my); }
  if(k===2){ const ds=[...svg.querySelectorAll(".disk")]; ds.forEach(d=>d.setAttribute("opacity",0)); const ru=svg.querySelector(".ruler"); if(ru) ru.setAttribute("opacity",0);
    for(const d of ds){ const x=+d.dataset.x, y=+d.dataset.y; await tween(340,t=>{ d.setAttribute("opacity",t); d.setAttribute("transform",`translate(${x} ${y-7*(1-t)}) scale(${1.5-.5*t})`); },my); if(!alive()) return; }
    if(ru) await tween(320,t=>ru.setAttribute("opacity",t),my); }
  if(k===3){ await tween(1300,t=>scaleZones(svg,0.001+0.549*t),my); }
  if(k===4){ await tween(800,t=>scaleZones(svg,0.55+0.45*t),my); if(!alive()) return; const ex=svg.querySelector(".extra"); ex.setAttribute("opacity",0); ex.innerHTML=extraFor(v,PS.res); await tween(380,t=>ex.setAttribute("opacity",t),my); }
}
async function play(){
  const my=++token; const from = (PS.k===4||PS.k===0) ? 0 : PS.k;
  PS.k=from; visual(from); ui(from);
  for(let k=from+1;k<=4;k++){ await sleep(k===1?500:650); if(my!==token) return; PS.k=k; ui(k); await seg(k,my); if(my!==token) return; }
}

/* ================= POR BACTERIA ================= */
function renderBacteria(){
  const gramOf = o => ["STA","ENC","BHS","SPN"].includes(o.g) ? "gp" : "gn";
  view.innerHTML = `<header class="mhead enter" style="margin-bottom:16px"><div class="kicker">Elegir la prueba</div><h1>¿Qué aislaste?</h1><p class="lede">Toca el microorganismo para ver qué mecanismos conviene buscar y por qué.</p></header>
  <div class="olist enter">${ORGS.map((o,i)=>{ const gr=gramOf(o); return `<details class="oc" style="${gStyle(gr)}"${i===0?" open":""}><summary><span class="og">${glyph(ORG_SHAPE[o.g]||"rod")}</span><span style="min-width:0"><b>${o.o}</b><small>${gr==="gp"?"Grampositivo":"Gramnegativo"} · ${o.c.length} ${o.c.length===1?"prueba":"pruebas"}</small></span>${icon("chev","ic chev")}</summary>
    <div class="body">${o.c.map(([id,why])=>{ const m=MODS.find(x=>x.id===id); return `<button class="rec" type="button" data-go="${id}" style="${gStyle(groupOf(id))}"><span><b>${m.title}</b><p>${why}</p></span><span class="go">${icon("right")}</span></button>`; }).join("")}${o.off.map(t=>`<p class="off">${t}</p>`).join("")}</div></details>`; }).join("")}</div>`;
}
